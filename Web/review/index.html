<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>售后服务平台 · 服务评价</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    .page { max-width: 960px; margin: 0 auto; padding: 32px 20px 60px; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .top h1 { font-size: 26px; margin: 0; }
    .top .sub { color: #8a94a6; font-size: 13px; margin-top: 4px; }
    .link { color: #4f8cff; font-size: 13px; text-decoration: none; }
    .stats { display: flex; gap: 16px; margin-bottom: 24px; }
    .stat-card { flex: 1; padding: 18px 20px; border-radius: 12px; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.04); }
    .stat-card .num { font-size: 30px; font-weight: 700; color: #f59e0b; }
    .stat-card .lbl { font-size: 13px; color: #8a94a6; margin-top: 4px; }
    .dist { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 13px; }
    .dist .bar { flex: 1; height: 10px; background: #f1f4f9; border-radius: 5px; overflow: hidden; }
    .dist .fill { height: 100%; background: #f59e0b; border-radius: 5px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.04); }
    .card .head { display: flex; justify-content: space-between; align-items: center; }
    .rating { font-size: 18px; font-weight: 700; color: #f59e0b; }
    .time { color: #a5adbb; font-size: 12px; }
    .tags { margin-top: 8px; }
    .tag { display: inline-block; padding: 3px 10px; margin: 0 6px 6px 0; border-radius: 20px; font-size: 12px; color: #6b7686; background: #f4f6fa; }
    .content { margin-top: 10px; color: #3d4657; font-size: 14px; line-height: 1.7; white-space: pre-wrap; }
    .empty { text-align: center; color: #a5adbb; padding: 60px 0; }
    .hidden { display: none; }
    .err { margin-top: 10px; padding: 12px 16px; border-radius: 8px; background: #fef2f2; color: #dc2626; font-size: 13px; }
    body.dark .stat-card, body.dark .card { background: #1c2333; }
    body.dark .card .content { color: #dfe6f1; }
    body.dark .tag { color: #aab4c8; background: #232c40; }
    body.dark .top h1 { color: #fff; }
    body.dark .sub, body.dark .time, body.dark .empty { color: #7c879c; }
  </style>
</head>
<body class="dark">
  <main class="page">
    <div class="top">
      <div>
        <h1>服务评价 · 满意度统计</h1>
        <p class="sub" id="sub">管理端 · 统计与评价记录（服务端按角色裁剪数据）</p>
      </div>
      <a class="link" href="../login/index.html">返回登录</a>
    </div>
    <div class="err hidden" id="err"></div>

    <div class="stats hidden" id="statsWrap">
      <div class="stat-card"><div class="num" id="stAvg">-</div><div class="lbl">平均分</div></div>
      <div class="stat-card"><div class="num" id="stTotal">-</div><div class="lbl">评价总数</div></div>
      <div class="stat-card" id="stDistCard"><div class="lbl">评分分布</div><div id="stDist"></div></div>
    </div>

    <div id="list"></div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
