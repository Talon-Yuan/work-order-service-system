<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>售后服务平台 · 管理端登录</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="login-wrap">
    <div class="login-card">
      <h1 class="brand">售后服务平台</h1>
      <p class="sub">Web 管理端 · 登录</p>

      <!-- 登录方式切换：验证码 / 密码 -->
      <div class="tab">
        <button type="button" class="tab-btn active" id="tabCode">手机号验证码</button>
        <button type="button" class="tab-btn" id="tabPwd">密码登录</button>
      </div>

      <!-- 验证码登录表单 -->
      <form id="formCode" class="form">
        <label class="field">
          <span>手机号</span>
          <input id="phoneCode" type="tel" maxlength="11" placeholder="请输入手机号" autocomplete="tel" />
        </label>
        <label class="field">
          <span>验证码</span>
          <div class="row">
            <input id="code" type="text" maxlength="6" placeholder="6 位验证码" autocomplete="one-time-code" />
            <button type="button" class="btn-code" id="btnSend">获取验证码</button>
          </div>
        </label>
        <button type="submit" class="btn-primary">登录</button>
      </form>

      <!-- 密码登录表单（隐藏） -->
      <form id="formPwd" class="form hidden">
        <label class="field">
          <span>手机号</span>
          <input id="phonePwd" type="tel" maxlength="11" placeholder="请输入手机号" autocomplete="username" />
        </label>
        <label class="field">
          <span>密码</span>
          <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password" />
        </label>
        <button type="submit" class="btn-primary">登录</button>
      </form>

      <p class="tip">骨架演示：提交后调用 login 云函数 web 分支，验证码/密码通路由服务端校验。</p>
      <p class="err hidden" id="err"></p>
    </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
